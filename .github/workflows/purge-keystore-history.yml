name: Purge keystore history

# One-shot remediation for the 2026-10-03 keystore exposure.
# This file was previously tracked and has now been removed from HEAD.
# Self-triggering: committing this file is what runs the rewrite.
# Delete this file after the run succeeds.

on:
  push:
    branches: [main]
    paths: ['.github/workflows/purge-keystore-history.yml']

permissions:
  contents: write

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install git-filter-repo
        run: pip install --quiet git-filter-repo

      - name: Rewrite all history dropping keystore/
        run: git filter-repo --path keystore --invert-paths --force

      - name: Verify keystore is gone
        run: |
          if git log --all --name-only --format= | grep -q '^keystore/'; then
            echo "::error::keystore/ still present in history"
            exit 1
          fi
          echo "keystore/ absent from all history"

      - name: Force-push rewritten main
        run: |
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push --force origin refs/heads/main
